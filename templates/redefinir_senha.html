{% extends "base.html" %}

{% block title %}Redefinir senha - Fluxar Emissões{% endblock %}

{% block content %}
<div class="login-page d-flex align-items-center justify-content-center">
  <div class="login-card card shadow border-0 w-100">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="login-mark mx-auto mb-3">F</div>
        <h1 class="h3 mb-1">Definir nova senha</h1>
        <p class="text-body-secondary mb-0">Escolha uma nova senha para acessar o Fluxar Emissões.</p>
      </div>

      <form method="post" action="{{ url_for('redefinir_senha', token=token) }}">
        <div class="mb-3">
          <label class="form-label" for="nova_senha">Nova senha</label>
          <input
            class="form-control form-control-lg"
            type="password"
            id="nova_senha"
            name="nova_senha"
            minlength="8"
            autocomplete="new-password"
            autofocus
            required
          >
          <div class="form-text">Mínimo de 8 caracteres.</div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="confirmar_senha">Confirmar nova senha</label>
          <input
            class="form-control form-control-lg"
            type="password"
            id="confirmar_senha"
            name="confirmar_senha"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <button class="btn btn-primary btn-lg w-100" type="submit">Redefinir senha</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
